<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ödeme Sayacı</title>
<style>
  :root { --bg:#12151a; --panel:#1b1f26; --line:#2b313b; --ct:#6b9bd1; --t:#eabe54; --text:#e9edf2; --mute:#8b95a3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    font-family: "Segoe UI", system-ui, sans-serif; color: var(--text);
    background: radial-gradient(ellipse at 50% 0%, #1f2a3a, var(--bg) 65%);
  }
  .card {
    width: min(94vw, 520px); padding: 32px 24px; text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--t);
    border-radius: 6px; box-shadow: 0 16px 50px rgba(0,0,0,.5);
    animation: in .6s ease both;
  }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } }
  .label { font-size: .8rem; letter-spacing: 3px; color: var(--mute); text-transform: uppercase; }
  .amount {
    font-size: clamp(2.6rem, 12vw, 4rem); font-weight: 800; color: var(--t);
    margin: 6px 0 24px; text-shadow: 0 0 24px rgba(234,190,84,.35);
  }
  .timer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 26px; }
  .box { background: var(--bg); border: 1px solid var(--line); border-bottom: 3px solid var(--ct); border-radius: 4px; padding: 12px 2px; }
  .box span { display: block; font-size: clamp(1.6rem, 8vw, 2.4rem); font-weight: 700; font-variant-numeric: tabular-nums; }
  .box small { color: var(--mute); font-size: .7rem; letter-spacing: 2px; text-transform: uppercase; }
  .box.tick span { animation: pop .3s; }
  @keyframes pop { 50% { transform: scale(1.15); color: var(--ct); } }
  .done { display: none; color: var(--t); font-weight: 700; margin-bottom: 18px; }
  button {
    cursor: pointer; border: 0; border-radius: 4px; padding: 13px 30px;
    font-size: 1rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    background: var(--t); color: #1a1a1a; transition: .15s;
  }
  button:hover { background: #f5cf6b; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(234,190,84,.35); }
  button:active { transform: translateY(0); }

  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.75); z-index: 10; }
  .overlay.show { display: flex; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  .popup {
    text-align: center; padding: 26px 36px 28px; background: var(--panel);
    border: 1px solid var(--line); border-top: 3px solid var(--ct); border-radius: 6px;
    animation: boing .45s cubic-bezier(.2,2,.4,1);
  }
  @keyframes boing { from { transform: scale(.3); } }
  .finger { display: block; font-size: clamp(5.5rem, 26vw, 8.5rem); animation: wag .45s infinite alternate; }
  @keyframes wag { to { transform: translateY(-10px) rotate(7deg); } }
  .popup p { color: var(--mute); margin: 4px 0 18px; }
  .popup button { background: var(--ct); color: #0d1218; padding: 10px 26px; }
  .popup button:hover { background: #8bb4e0; box-shadow: 0 6px 20px rgba(107,155,209,.35); }
</style>
</head>
<body>
<div class="card">
  <div class="label">Toplam ödeme</div>
  <div class="amount">15.900 TL</div>

  <div class="timer">
    <div class="box"><span id="d">00</span><small>Gün</small></div>
    <div class="box"><span id="h">00</span><small>Saat</small></div>
    <div class="box"><span id="m">00</span><small>Dk</small></div>
    <div class="box"><span id="s">00</span><small>Sn</small></div>
  </div>

  <div class="done" id="done">Süre doldu, ödeme zamanı!</div>
  <button id="btn">Paramı istiyorum</button>
</div>

<div class="overlay" id="ov">
  <div class="popup">
    <span class="finger">🖕</span>
    <p>Sabret biraz, süre dolmadı.</p>
    <button id="close">Tamam</button>
  </div>
</div>

<script>
  // 1 Kasım 2026 + 8 gün = 9 Kasım 2026 20:25 (Türkiye saati)
  const target = new Date("2026-11-09T20:25:00+03:00").getTime();
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  let last = {};

  function update() {
    let diff = target - Date.now();
    if (diff <= 0) { diff = 0; $("done").style.display = "block"; }
    const v = {
      d: Math.floor(diff / 864e5),
      h: Math.floor(diff % 864e5 / 36e5),
      m: Math.floor(diff % 36e5 / 6e4),
      s: Math.floor(diff % 6e4 / 1e3)
    };
    for (const k in v) {
      const el = $(k);
      el.textContent = pad(v[k]);
      if (last[k] !== v[k]) { const b = el.parentElement; b.classList.remove("tick"); void b.offsetWidth; b.classList.add("tick"); }
    }
    last = v;
  }
  update(); setInterval(update, 1000);

  $("btn").onclick = () => $("ov").classList.add("show");
  $("close").onclick = () => $("ov").classList.remove("show");
  $("ov").addEventListener("click", e => { if (e.target === $("ov")) $("ov").classList.remove("show"); });
</script>
</body>
</html>
